<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact ServerHub | Sales &amp; Support</title>
<meta name="description" content="Contact ServerHub's sales and support team for quotes, sourcing requests, or account questions.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" data-site-header></header>

<section class="page-head">
  <div class="container">
    <h1>Get in Touch</h1>
  </div>
</section>

<section class="section-tight">
  <div class="container two-col-grid gap-lg">
    <div class="form-card">
      <form class="contact-form" novalidate>
        <div class="frow">
          <label>Name</label>
          <input class="fctl" type="text" data-required placeholder="Name">
          <span class="ferr">Please enter your name.</span>
        </div>
        <div class="frow">
          <label>Email</label>
          <input class="fctl" type="email" data-required placeholder="email@domain.com">
          <span class="ferr">Please enter a valid email.</span>
        </div>
        <div class="frow">
          <label>Company Name</label>
          <input class="fctl" type="text" placeholder="Business LLC">
        </div>
        <div class="frow">
          <label>Phone</label>
          <input class="fctl" type="tel" placeholder="000-000-0000">
        </div>
        <div class="frow">
          <label>Message</label>
          <textarea class="fctl" data-required placeholder="Message"></textarea>
          <span class="ferr">Please enter a message.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send</button>
      </form>
    </div>

    <div>
      <h2 style="font-size:clamp(22px,3vw,28px); margin-bottom:26px;">Reach out to us <span class="accent" style="color:var(--orange);">24/7/365</span> using the form &amp; a member of the team will get back to you <span class="accent" style="color:var(--orange);">ASAP</span>.</h2>

      <h3 style="font-size:16px; margin-bottom:14px;">Want to reach out directly?</h3>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <a href="mailto:sales@serverhub-demo.com" style="display:flex; align-items:center; gap:10px; font-weight:700; color:var(--navy); font-size:15px;"><i class="fa-solid fa-envelope" style="color:var(--orange);"></i> sales@serverhub-demo.com</a>
        <a href="tel:+18005550199" style="display:flex; align-items:center; gap:10px; font-weight:700; color:var(--navy); font-size:15px;"><i class="fa-solid fa-phone" style="color:var(--orange);"></i> (800) 555-0199</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" data-site-footer></footer>
<script src="js/main.js"></script>
</body>
</html>
